[project]
name = "testskill-finder"
version = "0.1.0"
description = "FastMCP server to find, read and apply 50+ QA/testing Agent Skills"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
testskill-finder = "testskill_finder.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
